<?xml version="1.0" encoding="UTF-8"?>
<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Wheel background with gradient -->
  <defs>
    <linearGradient id="wheelGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="segment1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8E8E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="segment2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ECDC4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6EE7E0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="segment3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#45B7D1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6AD1E7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="segment4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#96CEB4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B4E6C8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Outer ring with shadow effect -->
  <circle cx="150" cy="150" r="145" fill="url(#wheelGradient)" stroke="#000" stroke-width="1" opacity="0.2"/>
  <circle cx="150" cy="150" r="140" fill="url(#wheelGradient)" stroke="#000" stroke-width="2"/>

  <!-- Wheel segments with gradients -->
  <g transform="rotate(0, 150, 150)">
    <path d="M150,150 L150,10 A140,140 0 0,1 280,150 Z" fill="url(#segment1)"/>
    <text x="200" y="100" font-size="24" text-anchor="middle" fill="white" font-weight="bold">10</text>
  </g>
  <g transform="rotate(90, 150, 150)">
    <path d="M150,150 L150,10 A140,140 0 0,1 280,150 Z" fill="url(#segment2)"/>
    <text x="200" y="100" font-size="24" text-anchor="middle" fill="white" font-weight="bold">25</text>
  </g>
  <g transform="rotate(180, 150, 150)">
    <path d="M150,150 L150,10 A140,140 0 0,1 280,150 Z" fill="url(#segment3)"/>
    <text x="200" y="100" font-size="24" text-anchor="middle" fill="white" font-weight="bold">50</text>
  </g>
  <g transform="rotate(270, 150, 150)">
    <path d="M150,150 L150,10 A140,140 0 0,1 280,150 Z" fill="url(#segment4)"/>
    <text x="200" y="100" font-size="24" text-anchor="middle" fill="white" font-weight="bold">100</text>
  </g>

  <!-- Center circle with metallic effect -->
  <circle cx="150" cy="150" r="35" fill="#2c3e50" stroke="#000" stroke-width="1"/>
  <circle cx="150" cy="150" r="30" fill="url(#wheelGradient)" stroke="#000" stroke-width="1"/>
  <circle cx="150" cy="150" r="25" fill="#fff" stroke="#000" stroke-width="1"/>
  
  <!-- Decorative elements -->
  <circle cx="150" cy="150" r="5" fill="#000"/>
  
  <!-- Pointer with shadow -->
  <g transform="translate(150,10)">
    <path d="M0,0 L-10,20 L10,20 Z" fill="#2c3e50" filter="url(#shadow)"/>
    <path d="M0,0 L-8,16 L8,16 Z" fill="#fff"/>
  </g>

  <!-- Shadow filter -->
  <defs>
    <filter id="shadow" x="-20" y="-20" width="40" height="40">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg> 